name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: ./native/build.ps1
      - run: dotnet build RoomMute.sln -c Release
      - run: dotnet run --project RoomMute.Tests -c Release --no-build
